# dev 渠道包：Kova Dev.app —— identifier 与 旧桌面壳的 dev 配置 的 com.kova.assistant.dev
# 对齐，运行时按 extraMetadata.kovaChannel=dev 自动使用 dev 数据目录（互不污染）
appId: com.kova.assistant.dev
productName: Kova Dev
copyright: Copyright © Kova
directories:
  output: release-dev
  buildResources: icons
files:
  - dist/**
  - renderer-out/**
  - icons/**
  - package.json
extraResources:
  # sidecar 二进制必须在 asar 之外（可执行文件）——宿主经 process.resourcesPath/binaries 拉起。
  # filter 是保险：万一有人在 binaries/ 里跑过侧车（本机模式会落下 *.db 与 sessions/），
  # 不让这些运行残留进包。
  # 只打宿主实际拉起的稳定别名（kova-worker / kova-automation）：带 host 三元组的那份
  # 是构建/冒烟用的中间产物，进包等于把同一份 ~90-100MB 的二进制背两遍
  # （实测压缩后每个仍多 ~40MB，dmg 因此 +87MB）。
  # filter 失守有兜底：scripts/after-pack.cjs 会断言包内只有稳定别名，出现直接 fail。
  - from: binaries
    to: binaries
    filter:
      - "**/*"
      - "!*.db"
      - "!*.db-*"
      - "!sessions/**"
      - "!kova-worker-*"
      - "!kova-automation-*"
  # Apache-2.0 与第三方许可要求随分发提供许可与声明；放 resources 根目录（asar 外）。
  - from: ../../LICENSE
    to: LICENSE
  - from: ../../NOTICE
    to: NOTICE
  - from: ../../THIRD-PARTY-NOTICES.md
    to: THIRD-PARTY-NOTICES.md
extraMetadata:
  kovaChannel: dev
asar: true
# node-pty 的原生产物必须留在 asar 外：pty.node 要被 dlopen，Windows 侧还要
# 从 conpty.node 同目录的 conpty/ 子目录加载 conpty.dll 与 winpty 的 dll/exe。
# 1.1.x 起走 prebuilds/<plat>-<arch>/，不做显式解包时它可能被塞进 asar。
asarUnpack:
  - "**/node_modules/node-pty/**"
afterPack: scripts/after-pack.cjs
npmRebuild: false
mac:
  artifactName: ${productName}_${version}_${arch}.${ext}
  category: public.app-category.productivity
  icon: icons/icon.icns
  target:
    - target: dir
      arch: arm64
  identity: null
win:
  artifactName: ${productName}_${version}_${arch}-setup.${ext}
  icon: icons/icon.ico
linux:
  icon: icons/icon.png
