# dev 渠道包：Kova Dev.app —— identifier 与 旧桌面壳的 dev 配置 的 com.kova.assistant.dev
# 对齐，运行时按 extraMetadata.kovaChannel=dev 自动使用 dev 数据目录（互不污染）
appId: com.kova.assistant.dev
productName: Kova Dev
copyright: Copyright © Kova
directories:
  output: release-dev
  buildResources: icons
files:
  - dist/**
  - renderer-out/**
  - icons/**
  - package.json
extraResources:
  - from: binaries
    to: binaries
extraMetadata:
  kovaChannel: dev
asar: true
# node-pty 的原生产物必须留在 asar 外：pty.node 要被 dlopen，Windows 侧还要
# 从 conpty.node 同目录的 conpty/ 子目录加载 conpty.dll 与 winpty 的 dll/exe。
# 1.1.x 起走 prebuilds/<plat>-<arch>/，不做显式解包时它可能被塞进 asar。
asarUnpack:
  - "**/node_modules/node-pty/**"
afterPack: scripts/after-pack.cjs
npmRebuild: false
mac:
  artifactName: ${productName}_${version}_${arch}.${ext}
  category: public.app-category.productivity
  icon: icons/icon.icns
  target:
    - target: dir
      arch: arm64
  identity: null
win:
  artifactName: ${productName}_${version}_${arch}-setup.${ext}
  icon: icons/icon.ico
linux:
  icon: icons/icon.png
