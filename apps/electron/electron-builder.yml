appId: com.kova.assistant
productName: Kova
copyright: Copyright © Kova
directories:
  output: release
  buildResources: icons
files:
  - dist/**
  - renderer-out/**
  - icons/**
  - package.json
  # sourcemap 的 sourcesContent 内嵌还原出的 TS 源码，打进包里等于把源码发给
  # 用户（dist/main.cjs.map 一份就 12MB，node_modules 里还散着一堆 SDK 的 .map）。
  # 生产用不到它（报错栈没有按 map 还原的链路），开发走本地 dist 不受影响
  - "!**/*.map"
extraResources:
  # sidecar 二进制必须在 asar 之外（可执行文件）——宿主经 process.resourcesPath/binaries 拉起。
  # filter 是保险：万一有人在 binaries/ 里跑过侧车（本机模式会落下 *.db 与 sessions/），
  # 不让这些运行残留进包。
  # 只打宿主实际拉起的稳定别名（kova-worker / kova-automation）：带 host 三元组的那份
  # 是构建/冒烟用的中间产物，进包等于把同一份 ~90-100MB 的二进制背两遍
  # （实测压缩后每个仍多 ~40MB，dmg 因此 +87MB）。
  # filter 失守有兜底：scripts/after-pack.cjs 会断言包内只有稳定别名，出现直接 fail。
  - from: binaries
    to: binaries
    filter:
      - "**/*"
      - "!*.db"
      - "!*.db-*"
      - "!sessions/**"
      - "!kova-worker-*"
      - "!kova-automation-*"
  # Apache-2.0 与第三方许可要求随分发提供许可与声明；放 resources 根目录（asar 外），
  # 安装后可在应用资源目录直接查看。
  - from: ../../LICENSE
    to: LICENSE
  - from: ../../NOTICE
    to: NOTICE
  - from: ../../THIRD-PARTY-NOTICES.md
    to: THIRD-PARTY-NOTICES.md
asar: true
# node-pty 的原生产物必须留在 asar 外：pty.node 要被 dlopen，Windows 侧还要
# 从 conpty.node 同目录的 conpty/ 子目录加载 conpty.dll 与 winpty 的 dll/exe。
# 1.1.x 起走 prebuilds/<plat>-<arch>/，不做显式解包时它可能被塞进 asar。
asarUnpack:
  - "**/node_modules/node-pty/**"
afterPack: scripts/after-pack.cjs
npmRebuild: false
# 国内打包镜像：Electron 二进制走 npmmirror，摆脱 github 直连。
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
mac:
  artifactName: ${productName}_${version}_${arch}.${ext}
  category: public.app-category.productivity
  icon: icons/icon.icns
  # Intel(x64)与 Apple Silicon(arm64)双架构;最低系统由 Electron 44 决定:macOS 13 Ventura
  minimumSystemVersion: 13.0
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  identity: null
  extendInfo:
    NSAppleEventsUsageDescription: Kova 需要访问系统事件以支持自动化能力
    NSMicrophoneUsageDescription: Kova 录音相关能力需要麦克风权限
win:
  artifactName: ${productName}_${version}_${arch}-setup.${ext}
  icon: icons/icon.ico
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  icon: icons/icon.png
  category: Utility
