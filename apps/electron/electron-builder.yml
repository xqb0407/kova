appId: com.kova.assistant
productName: Kova
copyright: Copyright © Kova
directories:
  output: release
  buildResources: icons
files:
  - dist/**
  - renderer-out/**
  - icons/**
  - package.json
extraResources:
  # sidecar 二进制必须在 asar 之外（可执行文件）——宿主经 process.resourcesPath/binaries 拉起。
  # filter 是保险：万一有人在 binaries/ 里跑过侧车（本机模式会落下 *.db 与 sessions/），
  # 不让这些运行残留进包。
  - from: binaries
    to: binaries
    filter:
      - "**/*"
      - "!*.db"
      - "!*.db-*"
      - "!sessions/**"
asar: true
# node-pty 的原生产物必须留在 asar 外：pty.node 要被 dlopen，Windows 侧还要
# 从 conpty.node 同目录的 conpty/ 子目录加载 conpty.dll 与 winpty 的 dll/exe。
# 1.1.x 起走 prebuilds/<plat>-<arch>/，不做显式解包时它可能被塞进 asar。
asarUnpack:
  - "**/node_modules/node-pty/**"
afterPack: scripts/after-pack.cjs
npmRebuild: false
mac:
  artifactName: ${productName}_${version}_${arch}.${ext}
  category: public.app-category.productivity
  icon: icons/icon.icns
  target:
    - target: dir
      arch: arm64
  identity: null
  extendInfo:
    NSAppleEventsUsageDescription: Kova 需要访问系统事件以支持自动化能力
    NSMicrophoneUsageDescription: Kova 录音相关能力需要麦克风权限
win:
  artifactName: ${productName}_${version}_${arch}-setup.${ext}
  icon: icons/icon.ico
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  icon: icons/icon.png
  category: Utility
