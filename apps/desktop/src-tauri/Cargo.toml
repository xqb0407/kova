[package]
name = "kova"
version = "1.1.2-preview"
description = "Kova AI Assistant Desktop Application"
authors = ["Kova"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "kova_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "devtools", "unstable"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls"] }
base64 = "0.22"
tokio = { version = "1", features = ["sync", "net", "rt", "macros", "time", "io-util"] }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
if-addrs = "0.13"
rusqlite = { version = "0.40.2", features = ["bundled"] }
aes-gcm = "0.10"
log = "0.4"
chrono = "0.4"
tauri-plugin-notification = "2"
portable-pty = "0.9.0"
# 备份/恢复：tar.gz 信封 + SigV4 签名 + 口令派生（均为纯 Rust 实现）
tar = "0.4"
flate2 = "1"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
pbkdf2 = "0.12"
# Unix 侧杀进程组（killpg）：bash 自立进程组后，超时/取消要连孙进程一起收
libc = "0.2"
# offline 是 headless_chrome 唯一的默认 feature，且必须显式保留：其 build.rs
# 走 auto_generate_cdp::init()，关掉 offline 后会改为构建期从 raw.githubusercontent.com
# 拉 CDP 协议 json（compile.rs:1293），墙内必超时并 panic 掉整个 tauri build
headless_chrome = { version = "1.0.10", features = ["offline"] }

[profile.release]
# 刻意不设 panic = "abort"：abort 不回卷栈，catch_unwind 就捕获不到 panic，
# 任何一个命令里的意外 panic 都会直接终止进程（曾因 stderr 写失败而实机崩溃，
# 见 src/panic_guard.rs）。代价是二进制带展开表：实测 13.33MB → 16.62MB
# （+3.29MB / +24.7%，同机同 profile 单变量对比），换稳定性值得。
codegen-units = 1
lto = true
opt-level = "s"
strip = true
