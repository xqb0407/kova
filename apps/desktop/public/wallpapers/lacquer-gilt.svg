<!--
  漆金主题内置壁纸：漆器描金。
  鎏金纹样：底部一道满幅回纹边饰（裁切也无妨，边饰本来就连绵）、
  中右一枝卷草（一藤三卷）、左上两朵云纹（螺卷 + 长尾）、底部一道矮草。
  金分两档（亮金勾线、沉金衬笔），透明底靠壁纸 veil 的窗格底色混色
  适配深浅两种模式。
  注意：XML 注释里不允许出现连续连字符，写 CSS 变量名时用文字代替。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- 回纹单元：与色块等高（80），保证恰好一行，不错行 -->
    <pattern id="huwen" width="48" height="80" patternUnits="userSpaceOnUse">
      <path d="M8,64 L8,26 L40,26 L40,52 L20,52 L20,38 L28,38"
        fill="none" stroke="#a97f2f" stroke-width="3" stroke-linecap="square"/>
    </pattern>
  </defs>

  <!-- 底部回纹边饰：上下界栏 + 一排回字 -->
  <rect x="0" y="812" width="1600" height="4" fill="#a97f2f" opacity="0.45"/>
  <rect x="0" y="896" width="1600" height="4" fill="#a97f2f" opacity="0.45"/>
  <rect x="0" y="816" width="1600" height="80" fill="url(#huwen)" opacity="0.34"/>

  <!-- 中右：卷草一藤三卷，螺旋收进花心、不再外翻 -->
  <g fill="none" stroke-linecap="round">
    <path d="M1240,300 C1160,380 1180,470 1090,520 C1000,570 960,650 990,740"
      stroke="#c9a24b" stroke-width="6" opacity="0.40"/>
    <!-- 卷 A（上） -->
    <path d="M1240,300 c30,-20 70,-12 78,16 c7,24 -12,44 -36,42 c-20,-2 -30,-20 -24,-36
      c5,-12 18,-15 26,-8" stroke="#c9a24b" stroke-width="4" opacity="0.48"/>
    <!-- 卷 B（中） -->
    <path d="M1090,520 c-36,-14 -48,-54 -26,-80 c20,-22 54,-16 64,8 c9,22 -6,44 -28,48
      c-17,3 -31,-10 -28,-26" stroke="#c9a24b" stroke-width="4" opacity="0.44"/>
    <!-- 卷 C（下） -->
    <path d="M990,740 c-28,8 -56,-8 -60,-34 c-4,-22 13,-40 36,-38 c19,2 30,20 25,36
      c-4,13 -19,17 -28,9" stroke="#c9a24b" stroke-width="4" opacity="0.42"/>
    <!-- 藤上小卷 -->
    <path d="M1160,424 c-20,-4 -30,-22 -24,-40" stroke="#a97f2f" stroke-width="3" opacity="0.4"/>
    <path d="M1044,608 c-18,8 -38,2 -46,-16" stroke="#a97f2f" stroke-width="3" opacity="0.38"/>
    <!-- 花心蕊点 -->
    <g fill="#c9a24b" stroke="none">
      <circle cx="1256" cy="332" r="5" opacity="0.5"/>
      <circle cx="1108" cy="516" r="5" opacity="0.46"/>
      <circle cx="988" cy="716" r="5" opacity="0.44"/>
    </g>
  </g>

  <!-- 底部矮草：沿回纹上方一道沉金草叶 -->
  <g fill="none" stroke-linecap="round">
    <path d="M150,770 C260,730 340,780 440,760 C540,740 600,700 700,716"
      stroke="#a97f2f" stroke-width="4" opacity="0.30"/>
    <path d="M320,756 q14,-30 44,-40 M520,744 q16,-26 44,-32" stroke="#a97f2f" stroke-width="3" opacity="0.28"/>
  </g>

  <!-- 左上：云纹两朵（螺卷 + 长尾） -->
  <g fill="none" stroke-linecap="round">
    <path d="M320,214 c-2,-30 24,-54 54,-50 c26,4 40,28 34,52 c-5,20 -24,32 -42,26
      c-14,-5 -20,-20 -14,-32 c5,-9 16,-12 24,-7 M370,216 q46,-18 92,-12"
      stroke="#c9a24b" stroke-width="4" opacity="0.32"/>
    <path d="M600,120 c-2,-22 18,-40 40,-37 c19,3 29,21 25,38 c-4,15 -18,24 -31,19
      c-10,-4 -15,-15 -10,-24 c4,-7 12,-9 18,-5 M632,122 q34,-13 68,-9"
      stroke="#a97f2f" stroke-width="3" opacity="0.26"/>
  </g>

  <!-- 金屑散点 -->
  <g fill="#c9a24b">
    <circle cx="880" cy="380" r="4" opacity="0.30"/>
    <circle cx="920" cy="420" r="3" opacity="0.24"/>
    <circle cx="856" cy="452" r="3" opacity="0.22"/>
    <circle cx="1380" cy="480" r="4" opacity="0.26"/>
    <circle cx="1340" cy="540" r="3" opacity="0.22"/>
    <circle cx="820" cy="640" r="4" opacity="0.24"/>
    <circle cx="880" cy="690" r="3" opacity="0.20"/>
  </g>
</svg>
