<!--
  青瓷主题内置壁纸：冰裂纹（开片）。
  满幅的不规则开片：几道主裂（粗、深）分出大区块，次裂与细纹再细分，
  釉青色随层级渐淡，模拟龙泉青瓷釉面的自然开片。纹样满幅铺开，
  cover 裁切到哪都是纹，无安全区概念。
  注意：XML 注释里不允许出现连续连字符，写 CSS 变量名时用文字代替。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice"
  fill="none" stroke="#5f8f7c" stroke-linecap="round" stroke-linejoin="round">
  <!-- 主裂：分出大区块 -->
  <g stroke-width="2.5" opacity="0.38">
    <path d="M180,120 L320,260 L300,430 L420,540 L400,760 L520,900"/>
    <path d="M1450,80 L1330,240 L1350,400 L1240,560 L1260,780 L1150,950"/>
    <path d="M100,760 L260,640 L440,700 L620,580 L830,650"/>
    <path d="M760,60 L800,220 L930,330 L900,500"/>
    <path d="M1500,600 L1350,700 L1420,860"/>
    <path d="M620,120 L700,260 L650,420"/>
    <path d="M540,880 L700,820 L860,880 L1010,840"/>
    <path d="M420,80 L470,200 L560,300"/>
  </g>
  <!-- 次裂：从主裂分叉 -->
  <g stroke-width="1.5" opacity="0.26">
    <path d="M320,260 L430,300 L520,280"/>
    <path d="M300,430 L210,520 L190,610"/>
    <path d="M420,540 L380,660 L460,730"/>
    <path d="M930,330 L1030,380 L1120,350"/>
    <path d="M800,220 L760,120"/>
    <path d="M1240,560 L1160,620 L1180,720"/>
    <path d="M620,580 L560,660 L600,740"/>
    <path d="M1350,400 L1420,470"/>
    <path d="M400,760 L300,800"/>
    <path d="M900,500 L860,610 L920,700"/>
    <path d="M650,420 L580,470"/>
    <path d="M260,640 L180,600"/>
    <path d="M830,650 L900,740"/>
    <path d="M1260,780 L1350,830"/>
    <path d="M700,260 L740,360 L830,410"/>
    <path d="M440,700 L520,780"/>
    <path d="M560,300 L680,330 L780,300"/>
    <path d="M580,420 L680,470 L760,540"/>
    <path d="M470,200 L380,160"/>
    <path d="M740,360 L720,460"/>
    <path d="M780,300 L860,340"/>
  </g>
  <!-- 细纹：短促的末梢 -->
  <g stroke-width="1" opacity="0.16">
    <path d="M430,300 L470,360"/>
    <path d="M210,520 L150,560"/>
    <path d="M380,660 L330,700"/>
    <path d="M1030,380 L1080,430"/>
    <path d="M1160,620 L1100,650"/>
    <path d="M560,660 L500,690"/>
    <path d="M760,120 L700,80"/>
    <path d="M1420,470 L1470,520"/>
    <path d="M860,610 L820,640"/>
    <path d="M580,470 L530,500"/>
    <path d="M520,780 L560,830"/>
    <path d="M1120,350 L1180,330"/>
    <path d="M300,800 L250,850"/>
    <path d="M920,700 L980,740"/>
    <path d="M1180,720 L1140,780"/>
    <path d="M460,730 L420,780"/>
  </g>
</svg>
