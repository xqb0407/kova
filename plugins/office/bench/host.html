<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>office bench host</title>
<style>html,body{margin:0;background:#222}iframe{width:1440px;height:900px;border:0;display:block}</style>
</head>
<body>
<iframe id="f"></iframe>
<script>
/**
 * 性能基准宿主：模拟真实宿主（iframe + postMessage 协议），把合成大档推给 office 面板。
 * 参数：?kind=deck|sheet&pages=200&rows=200&cols=250
 */
const params = new URLSearchParams(location.search);
const kind = params.get("kind") || "deck";
const pages = Number(params.get("pages") || 200);
const rows = Number(params.get("rows") || 200);
const cols = Number(params.get("cols") || 250);
const PATH = kind === "sheet" ? "bench.sheet.univer.json" : "bench.deck.canvas.json";
const uiPort = params.get("ui") || "5199";
const emit = params.get("emit");
const iframeQuery = emit !== null && emit !== "" ? `?sheetEmitDelay=${encodeURIComponent(emit)}` : "";

function makeDeck() {
  const frames = [];
  for (let p = 0; p < pages; p++) {
    const els = [{
      kind: "text", id: `t${p}a`, x: 80, y: 60, w: 900, h: 70,
      runs: [
        { text: `第 ${p + 1} 页标题`, bold: true, size: 40, color: "#111827" },
        { text: " · 副标题", size: 24, color: "#6b7280" },
      ],
      align: "left", vAlign: "middle", lineHeight: 1.2,
    }];
    for (let i = 0; i < 4; i++) {
      els.push({
        kind: "text", id: `t${p}b${i}`, x: 80, y: 170 + i * 110, w: 700, h: 90,
        runs: [{ text: `要点 ${i + 1}：这是用于性能基准的合成正文，包含中英文混排 Data ${p}-${i}，长度约八十个字符，用于触发行内排版与换行计算。`, size: 20, color: "#374151" }],
        align: "left", vAlign: "top", lineHeight: 1.6,
      });
    }
    els.push({ kind: "shape", shape: "rect", id: `s${p}a`, x: 840, y: 170, w: 360, h: 200, fill: "#eef2ff", stroke: "#2563eb", strokeWidth: 2, radius: 12 });
    els.push({ kind: "shape", shape: "ellipse", id: `s${p}b`, x: 840, y: 410, w: 180, h: 180, fill: "#dcfce7", stroke: "#166534", strokeWidth: 2 });
    frames.push({
      id: `f${p}`, type: "slide", x: 0, y: p * 800, w: 1280, h: 720,
      background: p % 5 === 0 ? "#0b1526" : "#ffffff",
      elements: els,
    });
  }
  return { version: 2, meta: { name: "bench", pagePreset: "16:9", kind: "deck", pageNumber: true, footer: "bench" }, objects: [], frames };
}

function makeSheet() {
  const cellData = {};
  for (let r = 0; r < rows; r++) {
    const row = { 0: { v: `行 ${r + 1}` } };
    for (let c = 1; c < cols; c++) row[c] = { v: `值-${r}-${c}` };
    cellData[r] = row;
  }
  return {
    id: "wb-bench", name: "bench", sheetOrder: ["sh1"], styles: {},
    sheets: { sh1: { id: "sh1", name: "数据", rowCount: rows + 50, columnCount: cols + 10, cellData } },
  };
}

const doc = kind === "sheet" ? makeSheet() : makeDeck();
const json = JSON.stringify(doc);
const iframe = document.getElementById("f");
iframe.src = `http://localhost:${uiPort}/${iframeQuery}`;
let sent = false;

const post = (msg) => iframe.contentWindow.postMessage({ v: "kova-ui-plugin/1", dir: "host", ...msg }, "*");
function send() {
  if (sent) return;
  sent = true;
  post({ kind: "handshake", theme: "light", context: { workspaceName: "bench", fileRelPath: PATH } });
  post({ kind: "doc.open", rev: 1, json, external: true, path: PATH });
  window.__benchSentAt = Date.now();
}
window.addEventListener("message", (e) => {
  const d = e.data;
  if (!d || d.dir !== "ui") return;
  if (d.kind === "ui.ready") send();
  if (d.kind === "doc.request") {
    post({ kind: "doc.open", rev: 1, json, external: true, path: PATH });
  }
  if (d.kind === "doc.list") {
    post({ kind: "doc.list.reply", reqId: d.reqId, items: [] });
  }
  if (d.kind === "doc.change") {
    window.__changes = (window.__changes || 0) + 1;
    window.__lastChange = String(d.json || "");
    window.__changeBytes = (window.__changeBytes || 0) + String(d.json || "").length;
  }
});
iframe.addEventListener("load", () => setTimeout(send, 500));
window.__benchDocBytes = json.length;
</script>
</body>
</html>
