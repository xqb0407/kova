name: 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！提交前请先搜索是否已有相同 issue。
        描述清楚「要解决什么问题」比「要加什么按钮」更有助于讨论方案。

        > 本项目按「现状」提供；详见 [README 免责声明](https://github.com/xqb0407/kova-electron/blob/main/README.md#免责声明)。

  - type: textarea
    id: problem
    attributes:
      label: 需求背景
      description: 你遇到了什么问题？现有功能哪里不够用？
      placeholder: 我在……时，需要……，但现在只能……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 你希望它如何工作？可以是交互流程、配置项或 API 形态。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过哪些绕行方式或其它设计？
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 截图、参考实现、相关文档链接等。
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 issue，确认不是重复建议
          required: true
