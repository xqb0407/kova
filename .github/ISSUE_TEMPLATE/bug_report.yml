name: Bug 报告
description: 报告一个可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请先搜索是否已有相同 issue。
        请尽量提供可复现步骤和完整日志，这能大幅缩短排查时间。
        贴日志前请先脱敏：API Key、token、用户名、个人路径等。

        > 本项目按「现状」提供，AI 生成内容请自行核验；详见 [README 免责声明](https://github.com/xqb0407/kova-electron/blob/main/README.md#免责声明)。

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 实际发生了什么？与预期有什么不同？
      placeholder: 简洁清晰地描述问题……
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 …
        2. 点击 …
        3. 看到 …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望发生什么？
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - macOS
        - Windows
        - Linux
        - 其他
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Kova 版本
      description: 设置 → 关于，或安装包文件名
      placeholder: 例如 1.1.23-preview
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: 运行方式
      options:
        - 安装包（Release 下载）
        - 源码开发模式（bun run dev）
        - 源码构建运行（bun run build && bun run start）
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图 / 录屏
      description: 可直接拖拽图片或视频。日志请贴关键片段。
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 issue，确认不是重复问题
          required: true
        - label: 我已尝试最新版本，问题仍然存在
          required: false
