# 发版流水线（Electron 版）：打 tag → 构建 macOS + Windows 产物 → 建/填 Draft Release
#
# 为什么不再走 workflow artifact 中转：两个构建 job 原本各自 upload-artifact、
# 再由汇总 job 下载合并，那条路会吃 GitHub Actions 的 **artifact 存储额度**
# （额度用满时 upload-artifact 直接失败：Artifact storage quota has been hit，）
# 而安装包本来就要挂到 Release 上——多存一份纯属浪费。现在：
#   prepare 先建好 Draft Release（两个构建 job 不可能同时建、不会打架）
#   → 各构建 job 打包完直接 `gh release upload` 传进该 draft（--clobber 可重跑）
#   → 无汇总 job、无 artifact 存储占用。
#
# 签名口径：mac 包在打包流程里做 ad-hoc 深签（apps/electron/scripts/after-pack.cjs，
# 不加 hardened runtime——Electron 自带 Framework 在 ad-hoc 下会被 dyld 拒载）；
# 未公证 → 首次打开一次 GUI 引导。Win 未签名 → SmartScreen 提示（与旧版一致）。
#
# 用法：node scripts/release.mjs <版本号>（推 tag 触发）；也可在 Actions 页手动
# workflow_dispatch（此时 tag 取 apps/electron/package.json 的版本，即 v<version>）。
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

env:
  BUN_VERSION: 1.3.14

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
          else
            tag="v$(node -p "require('./apps/electron/package.json').version")"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release tag: $tag"
      - name: Ensure draft release exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag 已存在（draft 或已发布），直接复用"
          else
            gh release create "$tag" --draft --title "$tag" \
              --notes "自动构建产物（draft，尚未发布）。发布前请核对 dmg / exe 与 SHA256SUMS。"
          fi

  build-macos:
    needs: prepare
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        # sidecar 构建脚本读 `rustc -vV` 的 host 三元组给产物命名（bun --compile 不需要 cargo）
      - name: Install deps
        run: bun install
      - name: Ensure node-pty native binary
        # node-pty 1.1.x 自带 prebuilds/<plat>-<arch>/pty.node（N-API 跨 ABI 通用），
        # 正常无需编译；脚本先校验三个加载位置，缺失才走包自身的 install/postinstall。
        run: node scripts/build-native-deps.mjs
      - name: Build sidecar + renderer + main
        run: bun run build:sidecar && bun run build:renderer && bun run build:main
      - name: Package dmg (ad-hoc signed via afterPack)
        run: cd apps/electron && ./node_modules/.bin/electron-builder --mac dmg
      - name: Checksums
        run: |
          cd apps/electron/release
          # 两平台同名会互相覆盖（同一 Release 上只能留一份），平台各一份
          shasum -a 256 *.dmg | awk '{print $1"  "$2}' > SHA256SUMS-macos.txt
          cat SHA256SUMS-macos.txt
      - name: Upload assets to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd apps/electron/release
          gh release upload "${{ needs.prepare.outputs.tag }}" \
            *.dmg SHA256SUMS-macos.txt --clobber

  build-windows:
    needs: prepare
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install deps
        run: bun install
      - name: Ensure node-pty native binary
        shell: bash
        run: node scripts/build-native-deps.mjs
      - name: Build sidecar + renderer + main
        run: bun run build:sidecar && bun run build:renderer && bun run build:main
      - name: Package NSIS installer
        run: cd apps/electron && ./node_modules/.bin/electron-builder --win nsis
      - name: Checksums
        shell: bash
        run: |
          cd apps/electron/release
          sha256sum *.exe | awk '{print $1"  "$2}' > SHA256SUMS-windows.txt
          cat SHA256SUMS-windows.txt
      - name: Upload assets to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd apps/electron/release
          gh release upload "${{ needs.prepare.outputs.tag }}" \
            *.exe SHA256SUMS-windows.txt --clobber