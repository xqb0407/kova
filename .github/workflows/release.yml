# 发布流水线：tag 推送到 GitHub 镜像仓时触发。
# 主开发仓在 Gitee，此仓库仅承担 CI 构建 + GitHub Releases 分发。
#
# 产物（Draft Release，手动确认后 Publish）：
#   - macOS Apple Silicon：扣瓦_<ver>_aarch64.dmg
#   - Windows x64：        扣瓦_<ver>_x64-setup.exe
#   - iOS（未签名 IPA，i4/爱思自签）：Kova_<ver>_iOS-unsigned.ipa
#   - Android（未签名 APK）：        Kova_<ver>_Android-unsigned.apk
# 无签名方案：mac 首次打开需引导（见 docs/release.md），Win 有 SmartScreen 提示。
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # 创建 Draft Release 需要

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14" # 与本地开发版本保持一致，升级 bun 时同步改这里
          cache: true
      - run: bun install
      # 逐文件独立进程跑套件：合跑时测试文件顺序（APFS/ext4 目录序差异）会跨文件
      # 串全局态（storage/automation/stdout 钩子），CI 用隔离模式求确定性
      - run: bun run test:isolated

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # Apple Silicon (arm64)
          - os: windows-latest # x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: bun install
      - name: 校验 macOS runner 为 Apple Silicon
        if: runner.os == 'macOS'
        run: '[ "$(uname -m)" = "arm64" ]'
      # beforeBuildCommand 会依次执行 build:sidecar（bun compile）与 next build
      - name: 构建 sidecar、前端与 Tauri 安装包
        working-directory: apps/desktop
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: bun run tauri build
      - name: 收集安装包
        shell: bash
        run: |
          mkdir -p dist
          find apps/desktop/src-tauri/target/release/bundle \
            \( -name '*.dmg' -o -name '*.exe' \) -exec cp {} dist/ \;
          ls -lh dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/

  ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install
      # 未签名 IPA，零凭据：apps/mobile/scripts/build-ipa.sh 走 xcodebuild
      # -project/-target 免签构建，产物留给 i4/爱思等工具自签安装（7 天）。
      - name: 构建未签名 iOS IPA
        working-directory: apps/mobile
        run: ./scripts/build-ipa.sh
      - name: 收集安装包
        shell: bash
        run: |
          mkdir -p dist
          VER=$(python3 -c "import json;print(json.load(open('apps/mobile/app.json'))['expo']['version'])")
          cp "apps/mobile/build/kova-mobile-${VER}.ipa" "dist/Kova_${VER}_iOS-unsigned.ipa"
          ls -lh dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist-ios
          path: dist/

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: bun install
      - name: Prebuild Android 原生工程
        working-directory: apps/mobile
        run: bunx expo prebuild --platform android --no-install
      # unsigned release APK：不配 keystore，产物留给自签/调试侧载
      - name: Gradle assembleRelease（未签名）
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - name: 收集安装包
        shell: bash
        run: |
          mkdir -p dist
          VER=$(python3 -c "import json;print(json.load(open('apps/mobile/app.json'))['expo']['version'])")
          APK=$(find apps/mobile/android/app/build/outputs/apk/release -name '*-unsigned.apk' | head -1)
          [ -n "$APK" ] || { echo "未找到 unsigned APK" >&2; exit 1; }
          cp "$APK" "dist/Kova_${VER}_Android-unsigned.apk"
          ls -lh dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: dist/

  release:
    # 桌面构建成功即发布；ios/android 失败不连坐（产物缺什么就发什么）
    needs: [test, build, ios, android]
    if: always() && needs.test.result == 'success' && needs.build.result == 'success'
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: 生成 SHA256 校验和
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - name: 创建 Draft Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
