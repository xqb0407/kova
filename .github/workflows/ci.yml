# 按需验证（手动触发）：类型检查 + 侧车全量测试，口径同本地 `bun run verify:goal`
# 的快速子集。不挂 push / pull_request 触发——日常零记录；发版前想自动验一把，
# 在 Actions 页手动 dispatch，或直接跑本地 `bun run verify:goal`。
# 发版构建走 release.yml（v* tag 触发，Draft Release）。
name: CI

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14

jobs:
  verify:
    name: verify
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # next-env.d.ts 是 next dev/build 生成的本地文件（gitignore），
      # 全新检出没有它：desktop 里 4 处 *.png 导入（favicon icon）会 TS2307。
      # typecheck 只需要 PNG 模块声明，这里生成最小版本即可。
      - name: Generate next-env.d.ts (png module declarations)
        working-directory: apps/desktop
        run: printf '/// <reference types="next" />\n/// <reference types="next/image-types/global" />\n' > next-env.d.ts
      - name: Typecheck (pi-runtime / uhp-protocol / desktop / kova-electron-main)
        run: bun run typecheck
      - name: Type floor / patches / changelog guards
        run: bun run check:type && bun run check:patches && bun run check:changelog
      - name: UHP contract tests
        run: bun run test:uhp
      - name: Electron main tests (includes UHP server integration)
        run: bun run --filter kova-electron-main test
      - name: Sidecar tests (bun test)
        run: bun run test
