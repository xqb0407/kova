# PR / push 门禁：类型检查 + 侧车全量测试。
# 口径与本地 `bun run verify:goal` 一致的快速子集——typecheck 链
# （pi-runtime / desktop / kova-electron-main）+ sidecar bun test（2772 例）；
# desktop/protocol/runtime 的专项测试与真机打包留给发版流水线（release.yml）。
# macOS 与开发机同平台，避免 pty/截图类用例在 Linux 上的平台差异。
name: CI

on:
  pull_request:
    branches: ["main", "dev"]
  push:
    branches: ["main", "dev"]

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14

jobs:
  verify:
    name: verify
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck (pi-runtime / desktop / kova-electron-main)
        run: bun run typecheck
      - name: Type floor / patches guards
        run: bun run check:type && bun run check:patches
      - name: Sidecar tests (bun test)
        run: bun run test
