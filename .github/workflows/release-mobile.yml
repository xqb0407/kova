# 移动端未签名产物流水线：**仅手动触发**（Actions 页 → Run workflow），
# 不进 tag 自动发布链路——桌面发版不被移动端的不确定性连坐。
# 产物只作为 workflow artifacts 保留 14 天，需要正式发布再挂 keystore/证书后扩展。
name: Mobile (unsigned, manual)

on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install
      # 未签名 IPA，零凭据：apps/mobile/scripts/build-ipa.sh 走 xcodebuild
      # -project/-target 免签构建，产物留给 i4/爱思等工具自签安装（7 天）。
      - name: 构建未签名 iOS IPA
        working-directory: apps/mobile
        run: ./scripts/build-ipa.sh
      - name: 收集产物
        shell: bash
        run: |
          mkdir -p dist
          VER=$(python3 -c "import json;print(json.load(open('apps/mobile/app.json'))['expo']['version'])")
          cp "apps/mobile/build/kova-mobile-${VER}.ipa" "dist/Kova_${VER}_iOS-unsigned.ipa"
          ls -lh dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist-ios
          path: dist/

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: bun install
      - name: Prebuild Android 原生工程
        working-directory: apps/mobile
        run: bunx expo prebuild --platform android --no-install
      # unsigned release APK：不配 keystore，产物留给自签/调试侧载
      - name: Gradle assembleRelease（未签名）
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - name: 收集产物
        shell: bash
        run: |
          mkdir -p dist
          VER=$(python3 -c "import json;print(json.load(open('apps/mobile/app.json'))['expo']['version'])")
          APK=$(find apps/mobile/android/app/build/outputs/apk/release -name '*-unsigned.apk' | head -1)
          [ -n "$APK" ] || { echo "未找到 unsigned APK" >&2; exit 1; }
          cp "$APK" "dist/Kova_${VER}_Android-unsigned.apk"
          ls -lh dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: dist/
